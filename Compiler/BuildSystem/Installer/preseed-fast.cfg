# ZerOS automated install. The ISO boot entry passes
# auto=true priority=critical preseed/file=/cdrom/preseed.cfg
# The target install script builds the compiler, app, and guest images.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false
d-i keyboard-configuration/ask_detect boolean false

d-i netcfg/choose_interface select auto
d-i netcfg/disable_autoconfig boolean false
d-i netcfg/dhcp_timeout string 60
d-i netcfg/dhcp_retries string 5
d-i netcfg/get_hostname string zeros
d-i netcfg/get_domain string localdomain

d-i mirror/country string manual
d-i mirror/http/hostname string mirrors.tuna.tsinghua.edu.cn
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie

d-i preseed/early_command string disk=$(list-devices disk 2>/dev/null | head -n1); if [ -z "$disk" ]; then disk=/dev/sda; fi; debconf-set partman-auto/disk "$disk"; debconf-set grub-installer/bootdev "$disk"

d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/sda
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i passwd/root-login boolean false
d-i passwd/user-fullname string ZerOS
d-i passwd/username string zeros
d-i passwd/user-password-crypted password __ZEROS_PASSWORD_HASH__
d-i passwd/user-default-groups string audio cdrom video
d-i user-setup/encrypt-home boolean false

d-i clock-setup/utc boolean true
d-i time/zone string UTC

d-i apt-setup/use_mirror boolean true
d-i apt-setup/non-free boolean false
d-i apt-setup/contrib boolean true
d-i apt-setup/security-updates boolean true
d-i popularity-contest/participate boolean false
d-i tasksel/first multiselect
d-i pkgsel/install-language-support boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/sda

d-i debian-installer/exit/poweroff boolean true
d-i preseed/late_command string cp /cdrom/zeros/payload.tar.gz /target/opt/zeros-payload.tar.gz && cp /cdrom/zeros/target-install.sh /target/opt/zeros-target-install.sh && in-target env ZEROS_FAST_PAYLOAD=/opt/zeros-payload.tar.gz bash /opt/zeros-target-install.sh || { echo "ZerOS fast install failed. See /var/log/zeros-build.log"; sleep 600; }

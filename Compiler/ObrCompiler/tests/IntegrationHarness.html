<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>ObrCompiler 严格集成验证</title>
<style>body{font:15px system-ui;margin:20px;background:#f5f6f8;color:#18202b}button{padding:9px 14px;margin-right:8px}iframe{width:660px;height:500px;background:black;border:1px solid #789}pre{white-space:pre-wrap}table{border-collapse:collapse;margin:15px 0}td,th{border:1px solid #bbb;padding:5px 10px}</style>
<h1>ObrCompiler 集成验证</h1><p>真实生产 CPU / GPU / 内核 / NAS；仅测试构建增加观察点。界面展示原始结果，未通过的项目保持失败。</p>
<button id="single">O1 启动及 pwd</button><button id="timing">baseline / O1 / O2 各五次启动</button><button id="smoke">真实命令采集</button><button id="legacy">旧 Peephole 内核对照</button>
<button id="legacy-firmware">旧 Peephole 固件分项对照</button>
<button id="signal">真实信号 ABI 验证</button><button id="device">O1 BIOS 设备验证</button>
<button id="resume">补跑缺失命令</button>
<button id="xargs-redir">xargs 输入重定向对照</button>
<button id="pipeline">原管道 baseline / O1 / O2 差分</button>
<button id="other-commands">其余常规命令差分</button>
<input id="capture-label" placeholder="设备截图说明"><button id="capture">保存设备截图及原生输入记录</button>
<p id="state">待运行</p><table><thead><tr><th>变体</th><th>命令</th><th>结果</th><th>启动至终端 present ms</th></tr></thead><tbody id="rows"></tbody></table>
<iframe id="vm" title="被测 ZerOS"></iframe><pre id="detail"></pre>
<script type="module">
const frame=document.querySelector('#vm'),state=document.querySelector('#state'),detail=document.querySelector('#detail'),table=document.querySelector('#rows');let busy=false;
let currentRun=null,manualInputs=[];
frame.addEventListener('load',()=>{if(!currentRun||currentRun.mode!=='bios-manual')return;try{for(const kind of['pointerdown','pointerup','pointermove','keydown','keyup'])frame.contentWindow.addEventListener(kind,event=>{if(!event.isTrusted)return;manualInputs.push({kind,time:performance.timeOrigin+performance.now(),trusted:event.isTrusted,key:event.key,code:event.code,x:event.clientX,y:event.clientY,button:event.button});},{capture:true,passive:true});}catch(error){detail.textContent=String(error);}});
const delay=ms=>new Promise(r=>setTimeout(r,ms));
async function api(path,data){const r=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});const value=await r.json();if(!r.ok)throw Error(value.error??r.status);return value;}
const texts=e=>(e?.data.rows??[]).map(r=>r.text.trimEnd()).filter(Boolean);
function collectionChannel(run){
 const channel=new BroadcastChannel('obrc-test-'+run),producers=new Map(),acks=new Map(),errors=[];let barrierToken=null,changed=Date.now();
 channel.onmessage=({data})=>{if(data?.kind==='producer'){producers.set(data.source,data.name);changed=Date.now();if(barrierToken)channel.postMessage({kind:'barrier',token:barrierToken,to:data.source});}else if(data?.kind==='barrier-ack'&&data.token===barrierToken){acks.set(data.source,data);changed=Date.now();}else if(data?.kind==='observer-error')errors.push(data);};
 return {close:()=>channel.close(),async barrier(requireFull){barrierToken=crypto.randomUUID();channel.postMessage({kind:'barrier',token:barrierToken});const until=Date.now()+15000;while(Date.now()<until){const all=producers.size>0&&[...producers.keys()].every(source=>acks.has(source));if(all&&Date.now()-changed>=150){const roles=[...producers.values()],required={page:1,'ZerOS.Hardware.Motherboard':1,'ZerOS.Hardware.Memory':1,'ZerOS.Hardware.Cpu':1,'ZerOS.Hardware.Cpu.Core':8};const full=Object.entries(required).every(([name,n])=>roles.filter(role=>role===name).length===n);const ok=errors.length===0&&[...acks.values()].every(a=>!a.error)&&(!requireFull||full);return{ok,token:barrierToken,required,producers:[...producers].map(([source,name])=>({source,name})),acks:[...acks.values()],errors};}await delay(50);}return{ok:false,token:barrierToken,producers:[...producers],acks:[...acks.values()],errors:[...errors,{error:'producer barrier timed out'}]};}};
}
async function screenshot(last){
 const canvas=frame.contentDocument.querySelector('canvas');if(!canvas)return{};const ctx=canvas.getContext('2d'),image=ctx.getImageData(0,0,canvas.width,canvas.height),bytes=image.data;
 // 只排除最后提示符后的一个闪烁光标格；原始 PNG 仍完整保留。
 const lastRow=last?.data.rows.at(-1);if(lastRow){const x=(lastRow.x??0)+lastRow.text.length*8,y=lastRow.y;for(let row=Math.max(0,y);row<Math.min(canvas.height,y+16);row++)for(let col=Math.max(0,x);col<Math.min(canvas.width,x+8);col++)bytes.fill(0,(row*canvas.width+col)*4,(row*canvas.width+col)*4+4);}
 const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(b=>b.toString(16).padStart(2,'0')).join('');return{width:canvas.width,height:canvas.height,pixelHash:hash,png:canvas.toDataURL()};
}
async function one(variant,command='',mode='smoke'){
 currentRun=null;frame.src='about:blank';await delay(150);const run=await api('/__start',{variant,command,mode});currentRun=run;manualInputs=[];const collection=mode==='timing'?null:collectionChannel(run.run);frame.src=`/vm/${variant}/index.html?run=${run.run}`;state.textContent=`运行 ${variant}: ${command||'启动'}`;
 const until=Date.now()+(mode==='bios-manual'?300000:60000);let record,terminal;
 while(Date.now()<until){record=await api('/__status?run='+run.run);detail.textContent=JSON.stringify({events:record.events.length,last:record.events.slice(-3)},null,2);terminal=record.events.find(e=>e.kind==='terminal'&&texts(e).some(row=>/^root@zeros:.*#/.test(row)));if(terminal)break;if(mode==='bios-manual'&&record.events.some(e=>e.kind==='power')&&Date.now()-Date.parse(record.started)<20000){for(const type of['keydown','keyup'])frame.contentWindow.dispatchEvent(new KeyboardEvent(type,{key:'F12',code:'F12',bubbles:true}));}await delay(100);}
 let status=terminal?'booted':'boot-timeout';
 if(terminal&&command){frame.contentWindow.postMessage({kind:'obrc-test-input',text:command+'\n'},location.origin);const limit=Date.now()+60000;while(Date.now()<limit){record=await api('/__status?run='+run.run);const last=record.events.filter(e=>e.kind==='terminal').at(-1),rows=texts(last);if(record.events.some(e=>e.kind==='input-done')&&rows.filter(r=>/^root@zeros:.*#/.test(r)).length>=2){status='command-complete';break;}await delay(100);}if(status!=='command-complete')status='command-timeout';}
 const collected=collection?await collection.barrier(Boolean(terminal)):{ok:true,mode:'timing-sparse'};record=await api('/__status?run='+run.run);const last=record.events.filter(e=>e.kind==='terminal').at(-1),power=record.events.find(e=>e.kind==='power');
 const result={run:run.run,status,collection:collected,faultsAtBarrierRequired:mode==='smoke',bootMs:terminal&&power?terminal.time-power.time:null,rows:texts(last),syscalls:record.events.filter(e=>e.kind==='syscall').map(e=>e.data),nasRequests:record.events.filter(e=>e.kind==='nas-request').map(e=>e.data),terminalSnapshot:last?.data??null,...await screenshot(last)};
 await api('/__finish',result);collection?.close();const tr=document.createElement('tr');for(const value of[variant,command||'启动',status+(collected.ok?'':' / 采集不完整'),result.bootMs?.toFixed(2)??'n/a']){const td=document.createElement('td');td.textContent=value;tr.append(td);}table.append(tr);detail.textContent=JSON.stringify({run:result.run,status,collection:collected,bootMs:result.bootMs,rows:result.rows,syscalls:result.syscalls.length,nasRequests:result.nasRequests.length,terminalSnapshot:result.terminalSnapshot,pixelHash:result.pixelHash,raw:'原始事件和完整PNG已保存在browser-results.json'},null,2);return result;
}
async function suite(work){if(busy)return;busy=true;try{await work();state.textContent='本轮运行完成，原始结果已保存；请检查差分结论。';}catch(error){state.textContent='失败：'+error;detail.textContent=error.stack;}finally{busy=false;}}
document.querySelector('#single').onclick=()=>suite(()=>one('O1','pwd'));
document.querySelector('#legacy').onclick=()=>suite(()=>one('legacy-kernel','','legacy-control'));
document.querySelector('#legacy-firmware').onclick=()=>suite(async()=>{for(const part of['bios','logo','load'])await one('legacy-'+part,'','legacy-control');});
document.querySelector('#signal').onclick=()=>suite(async()=>{for(const variant of['baseline','O1','O2'])await one(variant,'/bin/compiler-signal-smoke');});
document.querySelector('#xargs-redir').onclick=()=>suite(async()=>{for(const variant of['baseline','O1','O2'])await one(variant,'xargs echo < /boot/compiler-input');});
document.querySelector('#pipeline').onclick=()=>suite(async()=>{for(const variant of['baseline','O1','O2'])await one(variant,'cat /boot/compiler-input | xargs echo');});
document.querySelector('#device').onclick=()=>suite(()=>one('O1','','bios-manual'));
document.querySelector('#capture').onclick=async()=>{if(!currentRun||currentRun.mode!=='bios-manual')return;const canvas=frame.contentDocument.querySelector('canvas');if(!canvas)throw Error('设备画布不存在');const capture={run:currentRun.run,label:document.querySelector('#capture-label').value,time:performance.timeOrigin+performance.now(),width:canvas.width,height:canvas.height,png:canvas.toDataURL(),setup:'BIOS entry uses synthetic F12; nativeInputs contains only observed isTrusted events',nativeInputs:[...manualInputs]};await api('/__capture',capture);detail.textContent=JSON.stringify({label:capture.label,width:capture.width,height:capture.height,nativeInputs:capture.nativeInputs.length,saved:true},null,2);};
document.querySelector('#timing').onclick=()=>suite(async()=>{const v=['baseline','O1','O2'];for(let n=0;n<5;n++)for(let k=0;k<3;k++)await one(v[(n+k)%3],'','timing');});
const commands=['pwd','ls','cat /boot/compiler-input','grep beta /boot/compiler-input','cp /boot/compiler-input /boot/compiler-out','find /boot','sort /boot/compiler-input','head /boot/compiler-input','wc /boot/compiler-input','echo compiler-ok','cat /boot/compiler-input | xargs echo'];
document.querySelector('#smoke').onclick=()=>suite(async()=>{for(const command of commands)for(const v of['baseline','O1','O2'])await one(v,command);});
document.querySelector('#other-commands').onclick=()=>suite(async()=>{for(const command of commands.filter(c=>c!=='cat /boot/compiler-input | xargs echo'))for(const v of['baseline','O1','O2'])await one(v,command);});
document.querySelector('#resume').onclick=()=>suite(async()=>{const {runs}=await api('/__results');for(const command of commands)for(const v of['baseline','O1','O2'])if(!runs.some(r=>r.mode==='smoke'&&r.command===command&&r.variant===v&&r.result?.status==='command-complete'&&r.result.collection?.ok))await one(v,command);});
</script></html>
